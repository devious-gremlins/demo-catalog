---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: order-service
  title: Order Service
  description: Core microservice responsible for handling order placement and payment flows.
  annotations:
    backstage.io/techdocs-ref: dir:./docs/order-service
    backstage.io/source-location: url:https://github.com/devious-gremlins/demo-catalog/blob/main/catalog-info.yaml
    github.com/project-slug: devious-gremlins/demo-catalog
    orchestrator.io/workflows: '["order-management", "widgets-showcase"]'
  links:
    - url: https://github.com/devious-gremlins/demo-catalog
      title: GitHub Repository
      icon: github
    - url: https://grafana.example.com/d/order-service
      title: Service Dashboard
      icon: dashboard
spec:
  type: service
  lifecycle: production
  owner: group:default/engineering-team
  system: default/e-commerce
  providesApis:
    - api:default/payment-api
  dependsOn:
    - resource:default/order-db
    - component:default/inventory-service

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: inventory-service
  title: Inventory Service
  description: Microservice tracking product catalog availability and warehouse inventory.
  annotations:
    backstage.io/techdocs-ref: dir:./docs/inventory-service
    orchestrator.io/workflows: '["hello-world"]'
spec:
  type: service
  lifecycle: production
  owner: group:default/engineering-team
  system: default/e-commerce

---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payment-api
  title: Payment API
  description: REST API specification for credit card transactions and refund handling.
spec:
  type: openapi
  lifecycle: production
  owner: group:default/engineering-team
  definition: |
    openapi: "3.0.0"
    info:
      version: "1.0.0"
      title: Payment API
    paths:
      /payments:
        post:
          summary: Process a payment
          responses:
            '200':
              description: Payment authorized

---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: order-db
  title: Orders PostgreSQL Database
  description: Primary transactional database storing customer order histories.
spec:
  type: database
  lifecycle: production
  owner: group:default/engineering-team

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: e-commerce
  title: E-Commerce System
  description: Core platform services supporting retail orders and catalog browsing.
spec:
  owner: group:default/engineering-team

---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: engineering-team
  title: Platform Engineering Team
  description: Core infrastructure, developer tooling, and shared platform services.
spec:
  type: team
  profile:
    displayName: Platform Engineering
    email: platform-eng@example.com
    picture: https://avatars.githubusercontent.com/u/73601258?s=200&v=4
  children: []

---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: alex-developer
  title: Alex Developer
  description: Staff Platform Engineer leading service architecture and developer portal workflows.
spec:
  profile:
    displayName: Alex Developer
    email: alex.developer@example.com
    picture: https://avatars.githubusercontent.com/u/1024025?v=4
  memberOf:
    - engineering-team

---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: order-management-wizard
  title: Order Management Wizard
  description: Multi-step order workflow for testing step navigation (RHDHPLAN-1383)
  annotations:
    orchestrator.io/workflows: '["order-management"]'
  tags:
    - orchestrator
    - test-day
spec:
  owner: group:default/engineering-team
  system: default/e-commerce
  type: service

  parameters:
    - title: Choose Target Entity
      required:
        - target_entity
      properties:
        target_entity:
          title: Target Entity for the workflow run
          description: Select an entity from the catalog
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
    - title: Order Details
      required:
        - productId
        - quantity
        - priority
      properties:
        productId:
          title: Product
          type: string
          enum:
            - keyboard
            - monitor
            - laptop
            - dock
          default: keyboard
          ui:autofocus: true
        quantity:
          title: Quantity
          type: number
          minimum: 1
          maximum: 100
          default: 1
        priority:
          title: Priority
          type: string
          enum:
            - standard
            - express
          default: standard
    - title: Contact and Notes
      properties:
        notes:
          title: Notes
          type: string
          maxLength: 200
          description: Free-form notes about this order
        notify:
          title: Notify me when the order completes
          type: boolean
          default: false

  steps:
    - id: runWorkflow
      name: Run workflow
      action: orchestrator:workflow:run
      input:
        workflow_id: order-management
        target_entity: ${{ parameters.target_entity }}
        parameters:
          productId: ${{ parameters.productId }}
          quantity: ${{ parameters.quantity }}
          priority: ${{ parameters.priority }}

  output:
    links:
      - title: Open workflow run
        url: ${{ steps.runWorkflow.output.instanceUrl }}
      - title: Open Workflows Tab
        url: ${{ steps.runWorkflow.output.catalogEntityUrl }}
      - title: View in Orchestrator
        url: ${{ steps.runWorkflow.output.orchestratorWorkflowsUrl }}
